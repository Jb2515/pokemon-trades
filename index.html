<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jon's Pokémon GO Trade Collection</title><body style="font-family:system-ui;text-align:center;padding:40px;color:#36595a;background:#eef5ef">Loading Jon's Pokémon collection…<script>(async()=>{let s='';for(let i=0;i<13;i++)s+=await(await fetch('./c'+i+'.txt?v=2')).text();let b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);let t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()})().catch(e=>document.body.textContent='Could not load collection: '+e.message)</script>
