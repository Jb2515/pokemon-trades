<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jon's Pokémon GO Trade Collection</title><body style="font-family:system-ui;text-align:center;padding:40px;color:#36595a;background:#eef5ef">Loading Jon's Pokémon collection…<script>(async()=>{async function part(i){const urls=['./c'+i+'.txt?v=3','https://raw.githubusercontent.com/Jb2515/pokemon-trades/main/c'+i+'.txt?v=3'];let last;for(const url of urls){for(let n=0;n<3;n++){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}catch(e){last=e;await new Promise(x=>setTimeout(x,300*(n+1)))}}}throw new Error('data part '+(i+1)+'/13 failed: '+(last?.message||'network error'))}const a=await Promise.all(Array.from({length:13},(_,i)=>part(i))),s=a.join('').replace(/\s/g,'');let b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('This browser does not support the collection decoder. Please open the link in Chrome.');let t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()})().catch(e=>document.body.innerHTML='<div style="max-width:520px;margin:80px auto;font-size:18px;line-height:1.5"><b>Could not load collection</b><br><span style="font-size:14px">'+String(e.message||e)+'</span><br><button onclick="location.reload()" style="margin-top:20px;padding:12px 18px;border:0;border-radius:10px;background:#4d827d;color:white;font-weight:700">Try again</button></div>')</script>
