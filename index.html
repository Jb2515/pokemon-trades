<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef5ef"><title>Jon's Pokémon GO Trade Collection</title><style>*{box-sizing:border-box}body{margin:0;background:#07180d;color:#b9d7d2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:grid;place-items:center}.box{text-align:center;padding:28px;max-width:520px}.spin{width:42px;height:42px;border:4px solid #1c4537;border-top-color:#55a49a;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h2{margin:0 0 8px;font-size:22px}p{margin:6px 0;color:#9cbdb7}.small{font-size:12px;opacity:.8}</style></head><body><div class="box" id="box"><div class="spin"></div><h2>Loading Jon's Pokémon collection…</h2><p id="status">Preparing collection</p><p class="small">10,798 Pokémon · 774 shiny · 293 backgrounds · 1,497 costumes</p></div><script>(()=>{'use strict';const status=document.getElementById('status'),box=document.getElementById('box');function fail(msg){box.innerHTML='<h2>Could not load collection</h2><p>'+String(msg).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><p class="small">Please refresh the page once. If this still appears, open the link in Chrome.</p>'}function part(i){return new Promise((resolve,reject)=>{const f=document.createElement('iframe');f.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;top:-9999px';const timer=setTimeout(()=>{f.remove();reject(new Error('Collection part '+(i+1)+' timed out'))},20000);f.onload=()=>{clearTimeout(timer);try{const t=(f.contentDocument&&f.contentDocument.body?f.contentDocument.body.textContent:'').trim();f.remove();if(!t||t.length<20)throw new Error('Collection part '+(i+1)+' was empty');resolve(t)}catch(e){f.remove();reject(e)}};f.onerror=()=>{clearTimeout(timer);f.remove();reject(new Error('Collection part '+(i+1)+' could not load'))};f.src='./c'+i+'.txt?v=5';document.body.appendChild(f)})}async function go(){try{if(!('DecompressionStream' in window))throw new Error('This browser does not support the collection viewer. Please open the link in Chrome.');status.textContent='Loading collection data…';const parts=await Promise.all(Array.from({length:13},(_,i)=>part(i)));status.textContent='Opening 10,798 Pokémon…';const s=parts.join(''),b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){fail(e&&e.message?e.message:e)}}go()})();</script></body></html>
