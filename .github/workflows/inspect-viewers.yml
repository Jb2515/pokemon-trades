name: Inspect Pokemon viewers

on:
  push:
    paths:
      - '.github/workflows/inspect-viewers.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and compare viewers
        shell: python
        run: |
          import ast, base64, gzip, json, re, subprocess
          from pathlib import Path

          REFERENCE = '9b3c0a876914e5aa6cf76939f2c3277c33be516d'
          out = Path('debug'); out.mkdir(exist_ok=True)

          def decode_chunks(get_chunk, max_chunks=20):
              pieces=[]; last=None
              for i in range(max_chunks):
                  try: part=get_chunk(i)
                  except Exception: break
                  if not part: break
                  pieces.append(part.strip())
                  try:
                      raw=base64.b64decode(''.join(pieces))
                      html=gzip.decompress(raw).decode('utf-8')
                      if '<html' in html.lower() or '<!doctype' in html.lower(): return html,i+1
                  except Exception as e: last=str(e)
              raise RuntimeError(f'Could not decode payload: {last}')

          def current_chunk(i):
              p=Path(f'c{i}.txt')
              if not p.exists(): raise FileNotFoundError(p)
              return p.read_text(encoding='utf-8')
          def reference_chunk(i): return subprocess.check_output(['git','show',f'{REFERENCE}:c{i}.txt'],text=True)

          current,current_parts=decode_chunks(current_chunk)
          reference,reference_parts=decode_chunks(reference_chunk)
          (out/'current-decoded.html').write_text(current,encoding='utf-8')
          (out/'reference-32476.html').write_text(reference,encoding='utf-8')

          def balanced(text,start,op='[',cl=']'):
              depth=0; quote=None; esc=False
              for i in range(start,len(text)):
                  ch=text[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                      continue
                  if ch in "'\"`": quote=ch; continue
                  if ch==op: depth+=1
                  elif ch==cl:
                      depth-=1
                      if depth==0: return text[start:i+1],i+1
              raise ValueError('unclosed expression')

          def extract_array(text,name):
              # Find assignments even when variables are comma-chained: const S=[...],F=[...],R=[...]
              matches=list(re.finditer(r'(?<![\w$])'+re.escape(name)+r'\s*=\s*',text))
              if not matches: raise KeyError(name)
              last_err=None
              for m in matches:
                  pos=m.end()
                  while pos<len(text) and text[pos].isspace(): pos+=1
                  try:
                      if text.startswith('Object.freeze',pos):
                          pos=text.find('(',pos)+1
                          while text[pos].isspace(): pos+=1
                      if text.startswith('JSON.parse',pos):
                          p=text.find('(',pos)+1
                          while text[p].isspace(): p+=1
                          q=text[p]
                          if q not in "'\"": raise ValueError('JSON.parse argument is not string')
                          j=p+1; esc=False
                          while j<len(text):
                              ch=text[j]
                              if esc: esc=False
                              elif ch=='\\': esc=True
                              elif ch==q: break
                              j+=1
                          raw=ast.literal_eval(text[p:j+1])
                          return json.loads(raw)
                      if text[pos]=='[':
                          s,_=balanced(text,pos)
                          return json.loads(s)
                  except Exception as e: last_err=e
              raise ValueError(f'Could not parse {name}: {last_err}')

          S=extract_array(current,'S'); CF=extract_array(current,'F'); R=extract_array(current,'R')
          NAMES=extract_array(reference,'NAMES'); ROWS=extract_array(reference,'ROWS')
          cur=[]
          for i,r in enumerate(R):
              form=(CF[r[2]] if len(r)>2 and r[2] is not None and r[2] < len(CF) else '') or ''
              name=S[r[0]] + ((' · '+form) if form else '')
              mask=r[3] if len(r)>3 else 0
              cur.append({'i':i+1,'name':name,'cp':r[1],'shiny':bool(mask&1),'costume':bool(mask&2),'background':bool(mask&4),'shadow':bool(mask&8)})
          ref=[]
          for i,r in enumerate(ROWS):
              mask=r[2]
              ref.append({'i':i+1,'name':NAMES[r[0]],'cp':r[1],'shiny':bool(mask&256),'costume':bool(mask&4),'background':bool(mask&1),'mask':mask})

          same_order_name=sum(a['name']==b['name'] for a,b in zip(cur,ref))
          same_order_cp=sum(a['cp']==b['cp'] for a,b in zip(cur,ref))
          same_order_both=sum(a['name']==b['name'] and a['cp']==b['cp'] for a,b in zip(cur,ref))
          flag_diffs=[]; row_diffs=[]
          for a,b in zip(cur,ref):
              if a['name']!=b['name'] or a['cp']!=b['cp']:
                  if len(row_diffs)<60: row_diffs.append({'current':a,'reference':b})
              if any(a[k]!=b[k] for k in ('shiny','costume','background')):
                  if len(flag_diffs)<80: flag_diffs.append({'current':a,'reference':b})

          from collections import Counter,defaultdict
          def key(x): return (x['name'],x['cp'])
          curkeys=Counter(key(x) for x in cur); refkeys=Counter(key(x) for x in ref)
          common=sum((curkeys & refkeys).values())
          report={
              'current_parts':current_parts,'reference_parts':reference_parts,
              'current_rows':len(cur),'reference_rows':len(ref),
              'same_order_name':same_order_name,'same_order_cp':same_order_cp,'same_order_name_cp':same_order_both,
              'multiset_name_cp_common':common,
              'current_counts':{k:sum(x[k] for x in cur) for k in ('shiny','costume','background','shadow')},
              'reference_counts':{k:sum(x[k] for x in ref) for k in ('shiny','costume','background')},
              'row_diff_examples':row_diffs,'flag_diff_examples':flag_diffs,
          }
          (out/'dataset-compare.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if not k.endswith('examples')},indent=2,ensure_ascii=False))

      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/current-decoded.html debug/reference-32476.html debug/dataset-compare.json
          git diff --cached --quiet && exit 0
          git commit -m "Compare corrected and legacy datasets [skip ci]"
          git push
